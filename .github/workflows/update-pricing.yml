name: Automated Pricing Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # If we were using Playwright extensively, we would run:
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps chromium

      - name: Run Pricing Scraper
        run: npm run scrape

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/pricing.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No pricing changes detected. Skipping commit."
          else
            git commit -m "chore: automated pricing update"
            git push
          fi
